[package]
name = "weapon-workbench"
description = "Interactive procedural weapon assembly studio."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
veyra-weapons.workspace = true
ashlar.workspace = true
ashlar-manifold.workspace = true
ashlar-material.workspace = true
ashlar-bevy = { workspace = true, features = ["runtime-bake"] }
bevy = { workspace = true, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_color", "bevy_core_pipeline",
    "bevy_camera", "bevy_image", "bevy_light", "bevy_mesh", "bevy_pbr",
    "bevy_render", "bevy_shader", "bevy_text", "bevy_ui", "bevy_ui_render",
    "bevy_window", "bevy_winit", "bevy_gizmos", "default_font", "multi_threaded",
    "png", "x11", "tonemapping_luts",
] }
anyhow.workspace = true
clap.workspace = true
ron.workspace = true
serde.workspace = true

[lints]
workspace = true
