[package]
name = "strata-app"
description = "The engine core under the game's simulation: app states, the SimTick schedule, the clock, the f64 world position and render origin, the player and authority ports, the world loader and the placed sites. The non-render Bevy crates only."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
strata-core = { workspace = true }
# The plain data the engine core writes and the rules crate reads without bevy_app.
strata-types = { workspace = true }
strata-registry = { workspace = true }
# The loader builds the world source here so the server and the client get
# the same one; nothing above the sim constructs a world.
strata-worldgen = { workspace = true }
strata-flora = { workspace = true }
# Settlement layouts, as the content step writes them.
ron = { workspace = true }
# No rendering, no windowing: this crate runs under MinimalPlugins on a
# dedicated server. `bevy_state` for `AppState`; the rest is the umbrella's
# always-on set (ecs, app, math, time, transform, tasks). `Transform` comes
# from bevy_transform, which is not a render crate: the WorldPosition sync
# writes it here so the render crates above never compute a position.
bevy = { workspace = true, features = ["std", "bevy_state"] }
tracing = { workspace = true }
# What crosses the wire derives serde here, where the types live, so the
# replication adapter above needs no wire copies of them.
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `localStorage`, the web adapter of the `Store` port.
web-sys = { workspace = true, features = ["Window", "Storage"] }

[dev-dependencies]
# Tests read the shipped data compiled in; the shipped binaries read it from disk.
strata-registry = { workspace = true, features = ["shipped-data"] }

[lints]
workspace = true
