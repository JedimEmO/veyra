[package]
name = "strata-types"
description = "The plain data the engine core writes and the game's rules read: the player's intent, the sites near the observers, the water at a point. bevy_ecs and bevy_math only."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bevy_ecs = { workspace = true, features = ["std"] }
bevy_math = { workspace = true, features = ["std"] }
strata-registry = { workspace = true }
strata-worldgen = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
