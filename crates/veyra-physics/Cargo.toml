[package]
name = "veyra-physics"
description = "Veyra's physics: bolts and blades resolved against the colliders, and the hoverbike motor, over strata-physics. Bevy, no render."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
strata-app = { workspace = true }
strata-physics = { workspace = true }
veyra-rules = { workspace = true }
avian3d = { workspace = true, features = ["3d", "f32", "parry-f32", "parallel"] }
bevy = { workspace = true, features = ["std", "bevy_state"] }

[dev-dependencies]
strata-core = { workspace = true }
strata-registry = { workspace = true, features = ["shipped-data"] }
strata-stream = { workspace = true }
strata-worldgen = { workspace = true }
# The tests run the whole game sim around the physics: the combat tick and the ride's mount.
veyra-sim = { workspace = true, features = ["shipped-data"] }

[lints]
workspace = true
