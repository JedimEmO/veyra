[package]
name = "strata-registry"
description = "The game's registry set at its old paths: a facade over strata-data (the world schemas) and veyra-data (the game's own). No Bevy."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The shipped progression files compiled in (`SkillGraph::shipped` and friends),
# for tests and tools. The game and the server read the same files from disk.
shipped-data = ["veyra-data/shipped-data"]

[dependencies]
strata-data = { workspace = true }
veyra-data = { workspace = true }

[lints]
workspace = true
