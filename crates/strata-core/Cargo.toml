[package]
name = "strata-core"
description = "World coordinates, seeds, a deterministic RNG and simulation time for sci-fi-scrolls. No Bevy."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The same glam `bevy_math` re-exports, so `WorldPos` is a `bevy_math::DVec3`
# in every crate above without a conversion.
glam = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std's `Instant` panics in a browser.
web-time = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
pretty_assertions = { workspace = true }
ron = { workspace = true }

[lints]
workspace = true
