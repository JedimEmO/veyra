[package]
name = "strata-physics"
description = "Physics for sci-fi-scrolls: avian3d in the sim tick, heightfield colliders per region, the character controller. Bevy, no render."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
strata-core = { workspace = true }
# The colliders re-sample the world; the terrain crate is above this one and
# is never consulted, so the server has the ground without a renderer.
strata-worldgen = { workspace = true }
# Trees: the same placement the client draws, so a trunk the client shows
# is a trunk the server collides with (ADR 0005).
strata-registry = { workspace = true }
strata-flora = { workspace = true }
strata-sim = { workspace = true }
strata-stream = { workspace = true }
# No renderer: this crate is in the headless facade and runs on a dedicated
# server. `parry-f32` is the collider backend; `parallel` is the broad
# phase on the compute pool, a Bevy feature and not a crate.
avian3d = { workspace = true, features = ["3d", "f32", "parry-f32", "parallel"] }
bevy = { workspace = true, features = ["std", "bevy_state"] }
tracing = { workspace = true }

# Grounding adapters over the pure fitting result: no kernel, no renderer.
ashlar.workspace = true

[dev-dependencies]
veyra-buildings.workspace = true
# Test only: the fitted-building test collides with the proxies the content
# declares, and deriving those needs the authoring kernel. A dev dependency
# keeps it out of every runtime graph, which `just server-check` asserts.
ashlar-manifold.workspace = true

[lints]
workspace = true
