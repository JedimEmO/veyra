[package]
name = "strata-net"
description = "The transport and replication port for sci-fi-scrolls: the role, the status and the replicated marker every crate reads; strata-net-replicon is the adapter."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Unused by the port itself; kept so the layering is on record: a transport
# adapter replicates sim state (`Intent`, `WorldPosition`) and sits above
# `strata-sim`, never the other way round (ADR 0001).
strata-sim = { workspace = true }
bevy = { workspace = true, features = ["std"] }

[lints]
workspace = true
