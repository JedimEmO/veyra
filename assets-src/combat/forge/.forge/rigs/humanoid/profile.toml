# The humanoid rig profile: every number the pipeline holds a body, a prop or a
# clip to, in one file, read by Rust (forge_rig) and by Python (forge_gen.profile)
# alike. The bones themselves are in contract.json (generated from rig.glb —
# never edited by hand); the attachment points in sockets.json; the driven
# joint order in motion_skeleton.json. This file carries the scalars that used
# to be hard-coded in the Blender scripts and the validator, each with what it
# gates, so changing one is a diff and not an archaeology.

[profile]
name = "humanoid"                          # the profile's name; forge.toml's `rig =` names this directory
version = 1                                # bumps only when a bone name, parent or rest transform changes
contract = "contract.json"                 # the bone table, generated by `forge rig export-contract`
sockets = "sockets.json"                   # where a prop rides: named offsets from contract bones
motion_skeleton = "motion_skeleton.json"   # the driven layout a take writes, in take order
rig_glb = "rig.glb"                        # the rig as an artifact; the contract is derived from it
rig_blend = "rig.blend"                    # the same skeleton as a Blender file; the auto-rig opens it
fixture_clip = "fixture/cskel27_idle.glb"  # a driven-only clip with the rest pose; `forge gen rig-build` rebuilds rig.blend from it

[bones]
count = 55                         # every bone a body must carry: the driven joints plus the finger leaves
driven = 27                        # how many of them a clip animates (motion_skeleton.json lists them)
root = "Hips"                      # the only rootless bone; nothing may be inserted above it (see README.md)
armature_node = "Armature"         # the scene node above the root — a node, not a bone, and the first segment of every bone path
front = "+Z"                       # which way the REST pose faces: the toes sit at z = +0.16 in front of the ankles
reference_stature_m = 1.8          # the stature the rest pose was measured for; the auto-rig scales a body to it by default
min_stature_m = 1.4                # rig check refuses a body shorter than this (a prop mistaken for a body)
max_stature_m = 2.2                # rig check refuses a body taller than this (a giant, or a mesh still in raw units)
foot_tolerance_m = 0.05            # how far the lowest skinned vertex may sit from y = 0; feet on the ground is part of the contract
rest_rotation_tolerance = 0.001    # per-component quaternion gap above which a bone's rest rotation counts as re-posed (float noise is ~1e-6)
reference_clip = "walk"            # the library clip rig check binds to the subject: it drives all 27 joints, so binding is fully exercised
contact_foot_tolerance_m = 0.05    # rig check: the PLANTED foot's own lowest skinned vertex, on the reference clip's contact frames (the fitted witch measured -1.5..+3.0 cm)

[fit]
# The T-pose gate (forge gen prepare): the rest ROTATIONS are frozen, so the
# door refuses a mesh that is not already in the rest pose. The fix is always
# the reference image, never the weights. Bone LENGTHS are not gated here at
# all any more — they are measured per body by `forge gen skin`'s fit, which
# is why reach_min/reach_max are gone: they measured a body's span against
# wrists the fit was about to move to it, and profile.py now refuses a
# profile that still names either.
arm_height_tolerance_m = 0.15      # the arm tips must sit within this of the body's OWN shoulder line, or the arms are not horizontal
arm_tip_fraction = 0.9             # a vertex beyond this fraction of the half-span counts as arm-tip geometry for the height test
limb_radius_min_fraction = 0.22    # an ARM run's median cross-section over its length: a printed NOTE, never a refusal — moss_witch_v4 ships at 0.22/0.16 and the sliver read 0.20-0.21, so nothing separates them (2026-08-30)
landmarks = ["Neck", "LeftArm", "RightArm", "LeftForeArm", "RightForeArm",
             "LeftHand", "RightHand", "LeftUpLeg", "RightUpLeg", "LeftLeg",
             "RightLeg", "LeftFoot", "RightFoot", "LeftToeBase", "RightToeBase"]
asymmetry_arms = 0.35              # raw L/R gap the fit allows on upper arm and forearm; worst measured 28.7% (drow_warlock)
asymmetry_other = 0.20             # and everywhere else; worst measured 16.2% (the hip, on two bodies)

[rig]
# Preparing a body for the skinner (forge gen prepare): budget and cleanup.
# The bind-ladder knobs went with bone heat: SkinTokens makes the weights now
# and there is no shell or proxy pass to tune.
tri_budget = 60000                 # default triangle cap for a body; a heavier lift is decimated to it
decimate_margin = 0.8333333333333334 # decimate to budget * margin (1500/1800) so the result lands comfortably under the cap
unweighted_abort_fraction = 0.2    # if more than this share of vertices come back weightless, the skin failed — abort, do not ship a statue
dust_diagonal_m = 0.025            # a disconnected shell smaller than this across is generation debris and is dropped

[prop]
# The prop normalizer (forge gen prop): what a static mesh ships as.
tri_budget = 12000                 # refuse a prop above this; regenerate lighter rather than ship bulk
long_axis = "+Y"                   # a held prop's hilt-to-tip axis in the exported (glTF) frame; see sockets.json authoring_frame
front = "-Z"                       # a held prop's edge or sights face this way in the exported frame
origin = "grip"                    # a held prop has its grip point at the origin; a ground prop its lowest vertex; a hung prop its highest

[material]
# The look register applied with a hatchet, to bodies and props alike.
metallic = 0.0                     # forced on every material: the lighting is painted into the base colour and nothing argues with it
roughness = 0.9                    # forced on every material: matte, no gloss
backface_culling = false           # double-sided: an open shell's culled back face reads as a hole

[export]
# The character exporter (forge gen export): what it checks before a byte is written.
rest_tolerance_m = 0.0001          # a bone may sit this far from the reference rest position and still be the same bone
transform_tolerance = 0.00001      # the armature object's transform must be identity to this, component-wise
max_influences = 4                 # weights per vertex, normalised to 1.0
y_up = true                        # exported with +Y up, the glTF convention the contract is stated in
materials = "EXPORT"               # a lifted mesh is its look; the glb is where the textures ship, every image packed
animations = false                 # a body carries no clips; clips are separate files bound by name path
rest_direction_tolerance_deg = 1.0 # a fitted bone's local rest translation may point this far off the contract's; measured drift over a whole fitted skeleton was 0.0000 deg
length_ratio_min = 0.4             # and may be this short a multiple of the contract's length — shorter is a collapsed skeleton, not a short body
length_ratio_max = 2.5             # and this long a multiple; the fit's own band
rest_zero_length_m = 0.0001        # a segment shorter than this has no direction to check, so it is compared by position at rest_tolerance_m

[fingers]
# How the finger leaves hang off the driven hands (forge gen rig-build). Offsets
# are in the hand bone's own space: +Y along the fingers, +X across the
# knuckles (mirrored on the right hand), +Z the back of the hand.
knuckle_offset_m = 0.075           # distance from the hand joint to the knuckle line
thumb_segments_m = [0.032, 0.026]  # Thumb2 and Thumb3 lengths; Thumb1 is a driven joint and is only extended
rebuild_tolerance_m = 0.0001       # a rebuilt rig must match contract.json rest translations to this
rebuild_rotation_tolerance = 0.001 # and rest rotations, per quaternion component, to this

[[fingers.chain]]
name = "Index"                     # bones LeftHandIndex1..3 / RightHandIndex1..3
across_m = 0.03                    # offset across the knuckle line, left hand sign
segments_m = [0.04, 0.026, 0.02]   # segment lengths, knuckle outward

[[fingers.chain]]
name = "Middle"
across_m = 0.01
segments_m = [0.043, 0.028, 0.021]

[[fingers.chain]]
name = "Ring"
across_m = -0.01
segments_m = [0.04, 0.026, 0.02]

[[fingers.chain]]
name = "Pinky"
across_m = -0.03
segments_m = [0.033, 0.021, 0.017]

[review]
# Motion review thresholds (forge gen motion review). A take that trips none of
# these is mechanically sound, which is necessary and not sufficient: look at
# the sheet.
foot_skate_mps = 0.25              # a planted foot sliding faster than this
jitter_pct = 32.0                  # high-frequency noise as a percentage of real per-frame travel
penetration_m = 0.05               # the lowest foot this far below the floor
float_m = 0.1                      # the lowest foot never comes within this of the floor — it never plants
activity_m = 0.035                 # less joint travel than this means nothing meaningful happens...
static_speed_mps = 0.35            # ...and below this root speed the character is not travelling either
loop_gap_m = 0.12                  # pose mismatch across the loop seam
loop_vel_gap = 0.9                 # velocity mismatch across the seam, m/s
drift_deg = 35.0                   # heading wander over the clip
net_turn_deg = 25.0                # the heading the clip ends on, mod 360, for a clip that should not turn
stop_ratio = 0.45                  # end speed over peak speed — catches a locomotion take that arcs to a halt
